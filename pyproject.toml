[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-transformer"
version = "0.1.0"
description = "Transform ICS calendars using configurable rules"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "icalendar",
    "requests",
    "pyyaml",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]